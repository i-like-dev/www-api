

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>2026 美容展餐食滿意度調查 - 東森自然美</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #f4eee1 100%);
            color: #2d3436;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            padding: 30px 20px;
            text-align: center;
        }
        .logo {
            margin-bottom: 20px;
        }
        .logo img {
            max-width: 280px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .company-tag {
            font-size: 15pt;
            color: #008080;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        h1 {
            color: #008080;
            font-size: 26pt;
            font-weight: 800;
            margin: 0 0 10px 0;
        }
        .subtitle {
            font-size: 14pt;
            color: #555555;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .prize-banner {
            background: #fff8e1;
            border: 2px solid #ffb300;
            color: #d35400;
            padding: 18px 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255,179,0,0.15);
        }
        .prize-title {
            font-size: 19pt;
            font-weight: bold;
            margin: 0 0 6px 0;
        }
        .prize-desc {
            font-size: 13pt;
            margin: 0;
            opacity: 0.9;
        }
        .btn-open {
            background-color: #008080;
            color: white;
            font-size: 18pt;
            font-weight: bold;
            padding: 16px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,128,128,0.35);
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
            margin-bottom: 25px;
        }
        .btn-open:hover {
            background-color: #006666;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,128,128,0.45);
        }
        .rules-box {
            text-align: left;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            font-size: 11pt;
            color: #444444;
            line-height: 1.6;
            border-left: 5px solid #008080;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 10px;
        }
        .rules-title {
            font-weight: bold;
            color: #008080;
            margin-bottom: 6px;
            font-size: 12pt;
        }

        /* 網頁內動畫彈出對話框 (Animated Popup Dialog) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            transform: scale(0.8) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            padding: 35px 30px;
        }
        .modal-overlay.active .modal-container {
            transform: scale(1) translateY(0);
        }
        .modal-icon {
            font-size: 45pt;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 20pt;
            font-weight: bold;
            color: #008080;
            margin-bottom: 10px;
        }
        .modal-desc {
            font-size: 13pt;
            color: #555555;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .modal-btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn-confirm {
            background-color: #008080;
            color: white;
            font-size: 14pt;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0,128,128,0.3);
            flex: 1;
        }
        .btn-cancel {
            background-color: #e0e0e0;
            color: #333333;
            font-size: 14pt;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="http://docs.techmeow.tw/image.png" alt="東森自然美 Logo">
        </div>
        <div class="company-tag">東森自然美</div>
        <h1>2026 美容展餐食滿意度調查</h1>
        <div class="subtitle">我們正在調查同仁對於 2026 美容展的餐食滿意度，誠摯邀請您填寫！</div>
        
        <div class="prize-banner">
            <p class="prize-title">🎁 填問卷抽大獎：獨得 1000 枚東森幣！</p>
            <p class="prize-desc">8/24 將抽出一名幸運得主</p>
        </div>

        <button class="btn-open" onclick="openModal()">立即填寫問卷</button>

        <div class="rules-box">
            <div class="rules-title">📌 活動與抽獎說明：</div>
            <div>• 我們對於有效回覆並有意願參加抽獎活動的人，將於 <strong>8/24</strong> 日抽出一名獲得 <strong>1000 枚東森幣</strong>。</div>
            <div>• 本活動將使用電子郵件通知中獎者，未中獎者不另行通知。</div>
            <div style="margin-top: 6px;">• 調查連結：<a href="https://techmeow.tw/TucgKR5x" target="_blank" style="color: #008080;">https://techmeow.tw/TucgKR5x</a></div>
        </div>
    </div>

    <!-- 網頁內動畫彈出對話框 Modal -->
    <div class="modal-overlay" id="surveyModal">
        <div class="modal-container">
            <div class="modal-icon">✨</div>
            <div class="modal-title">準備填寫問卷</div>
            <div class="modal-desc">即將前往「2026 美容展餐食滿意度調查」，完成填寫即可參與 1000 枚東森幣抽獎！</div>
            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <a href="https://script.google.com/macros/s/AKfycbzSAtUNRXnc6uEpcv2NDLDSE0TjNnm4N_j_KT42hJSRbh52lozjPlXTNdhprLzD3y9ybw/exec?action=share&token=21453edffd884084a78c1c5fb5f7ca61" target="_blank" class="btn-confirm" onclick="closeModal()">前往填寫</a>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            var modal = document.getElementById('surveyModal');
            modal.classList.add('active');
        }
        function closeModal() {
            var modal = document.getElementById('surveyModal');
            modal.classList.remove('active');
        }
        window.onclick = function(event) {
            var modal = document.getElementById('surveyModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
